[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyquant"
version = "0.1.0"
description = "Educational post-training quantization of a small Fashion-MNIST classifier (FP32 vs INT8 vs INT4)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tinyquant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
